{% extends "base.html" %}
{% block title %}Polymarket Intel{% endblock %}
{% block content %}
<h1 class="page-title">Polymarket Intel</h1>
<p class="page-subtitle" data-i18n="page_subtitle">Real-time on-chain prediction market dashboard</p>

<div id="config-banner-host"></div>

<div class="stats-grid" id="stats-grid"></div>

<div class="tab-bar" role="tablist">
  <button class="tab-btn active" data-tab="events" data-i18n="tab_top_events">Top Events</button>
  <button class="tab-btn" data-tab="leaderboard" data-i18n="tab_leaderboard">Leaderboard</button>
  <button class="tab-btn" data-tab="activity" data-i18n="tab_activity">Live Activity</button>
  <button class="tab-btn" data-tab="markets" data-i18n="tab_markets">Markets</button>
</div>

<div id="tab-content"></div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
